# The audit trail, for per-message panels. Uses the read-only role "dashboard_reader" (migration 005):
# it can read security events (and their views), bans, strikes and policies — never API keys or canaries.
# Its password comes from DASHBOARD_DB_PASSWORD (.env); the gateway enables the role's login at startup.
apiVersion: 1
datasources:
  - name: Security events (PostgreSQL)
    uid: security-db
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: dashboard_reader
    jsonData:
      database: security
      sslmode: disable
      postgresVersion: 1600
      maxOpenConns: 5
    secureJsonData:
      password: ${DASHBOARD_DB_PASSWORD}
